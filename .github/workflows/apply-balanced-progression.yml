name: Verify Quest competition

on:
  push:
    branches:
      - feature/quest-redesign-canvas
    paths:
      - src/CompetitionPage.jsx
      - src/competition.js
      - src/competition.css
      - tests/competition.test.mjs
      - public/competition/**
      - .github/workflows/apply-balanced-progression.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/quest-redesign-canvas
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run progression and competition tests
        run: node --test tests/progression.test.mjs tests/competition.test.mjs

      - name: Build production app
        run: npm run build

      - name: Check repository whitespace
        run: git diff --check
