<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quest reminder</title><link rel="stylesheet" href="/notice.css"></head>
<body><article id="notice" role="status" aria-live="polite">
  <img class="cottage" src="quest://app/apple-touch-icon.png" alt="">
  <div class="copy"><div class="eyebrow"><span class="spark"></span> QUEST <span id="category">YOUR NEXT SMALL STEP</span></div><strong id="title"></strong><p id="body"></p><div class="actions"><button id="primary" type="button">Start session</button><button id="snooze" type="button">In 5 min</button><span id="feedback"></span></div></div>
  <button id="dismiss" type="button" aria-label="Dismiss reminder">×</button><div class="track"><span id="progress"></span></div>
</article><script src="/notice.js"></script></body></html>
